worker_processes auto;
pid /tmp/sidequest-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        server_name _;
        root /srv/sidequest;
        index index.html;
        client_max_body_size 1m;
        location = /healthz { proxy_pass http://127.0.0.1:8000/healthz; }
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
        location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
        location /games/ { try_files $uri =404; expires 7d; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}
