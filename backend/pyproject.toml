[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "arkiv-reviews-backend"
version = "0.1.0"
description = "Read-only FastAPI API and domain layer for the Arkiv review showcase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arkiv-sdk",
  "eth-account>=0.14,<0.15",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.uv.sources]
arkiv-sdk = { path = "../../arkiv-python-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/arkiv_reviews"]
